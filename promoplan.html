<title>Маркетинг Медиа</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Noto+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F1F3EE; --ink:#15181C; --muted:#5B6169; --line:#D9DCD3; --card:#FFFFFF;
  --accent:#E2A33B; --accent-ink:#40300E; --accent-soft:#FBE9C8;
  --good:#3C8A5B; --good-soft:#DFF0E6; --warn:#C97A24; --warn-soft:#FBEAD3;
  --bad:#C2453A; --bad-soft:#FBE1DE; --user-row:#FFF4E0; --user-row-line:#EBC888;
  --shadow:0 1px 2px rgba(20,20,15,.06), 0 4px 16px rgba(20,20,15,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14171B; --ink:#E9EAE5; --muted:#9BA1A8; --line:#2A2F35; --card:#1B1F24;
    --accent:#F0AE4C; --accent-ink:#20160A; --accent-soft:#3A2C0F;
    --good:#57B37D; --good-soft:#193226; --warn:#E8A24F; --warn-soft:#332212;
    --bad:#E2685C; --bad-soft:#391C1A; --user-row:#2E2712; --user-row-line:#4A3A15;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14171B; --ink:#E9EAE5; --muted:#9BA1A8; --line:#2A2F35; --card:#1B1F24;
  --accent:#F0AE4C; --accent-ink:#20160A; --accent-soft:#3A2C0F;
  --good:#57B37D; --good-soft:#193226; --warn:#E8A24F; --warn-soft:#332212;
  --bad:#E2685C; --bad-soft:#391C1A; --user-row:#2E2712; --user-row-line:#4A3A15;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans",-apple-system,"Segoe UI",sans-serif;line-height:1.45;overflow-x:hidden}
h1,h2,h3,h4{font-family:"Noto Serif",Georgia,serif;font-weight:700;text-wrap:balance;margin:0}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:var(--ink)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::placeholder{color:var(--muted);opacity:.8}

.app{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}

/* header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.tally{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);flex:none}
.brand h1{font-size:22px}
.brand .sub{color:var(--muted);font-size:12.5px}
.langsw{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.langsw button{border:0;background:transparent;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.langsw button.on{background:var(--accent);color:var(--accent-ink)}

/* nav */
.nav{display:flex;gap:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.nav button{border:0;background:transparent;padding:10px 16px;font-size:14.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
.nav button .n{display:inline-block;margin-left:6px;background:var(--line);color:var(--muted);border-radius:999px;font-size:11px;padding:1px 7px;font-family:"IBM Plex Mono",monospace}

.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.subnav button{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.subnav button.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row.fields > *{flex:1;min-width:160px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.field input,.field select,.field textarea{width:100%}
.hint{color:var(--muted);font-size:12.5px}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:12.5px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.badge.ai{background:var(--accent-soft);color:var(--accent-ink)}
.badge.user{background:var(--good-soft);color:var(--good)}
.badge.example{background:var(--warn-soft);color:var(--warn)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.me{background:var(--user-row)}
tr.me td:first-child{border-left:3px solid var(--user-row-line)}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table input{border:1px solid transparent;background:transparent;padding:4px 6px;width:100%;min-width:70px}
table input:hover{border-color:var(--line)}
table input:focus{background:var(--card);border-color:var(--accent)}

.empty{color:var(--muted);font-size:13.5px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:12px}

.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;background:var(--card);color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-title h3{font-size:17px}
.section-title h2{font-size:20px}

.comp-card{border:1px solid var(--line);border-radius:12px;padding:14px}
.comp-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.comp-head strong{font-size:14.5px}
.aiOut{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px;white-space:pre-wrap}
.aiOut.thinking{color:var(--muted);font-style:italic}

.bar-row{display:grid;grid-template-columns:140px 1fr 60px;align-items:center;gap:10px;font-size:12.5px}
.bar-track{position:relative;height:16px;background:var(--paper);border-radius:5px;overflow:visible;border:1px solid var(--line)}
.bar-fill{height:100%;border-radius:5px;background:var(--accent)}
.bar-fill.me{background:var(--good)}
.bar-median{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--muted)}
.verdict{font-size:13px;padding:8px 12px;border-radius:9px;margin-top:6px}
.verdict.up{background:var(--good-soft);color:var(--good)}
.verdict.down{background:var(--bad-soft);color:var(--bad)}

.trend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.trend-card{border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:6px}
.trend-card.ai{border-color:var(--accent-soft);background:linear-gradient(180deg,var(--accent-soft) 0%, transparent 40%)}

.plan-doc{border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--card)}
.plan-doc h4{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:18px;margin-bottom:8px}
.plan-doc h4:first-child{margin-top:0}
.countdown{display:inline-flex;align-items:baseline;gap:6px;background:var(--accent-soft);color:var(--accent-ink);padding:5px 13px;border-radius:999px;font-size:13px;font-weight:700}
.countdown .num{font-size:16px;font-family:"IBM Plex Mono",monospace}
.reel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.reel-card{border:1px solid var(--line);border-radius:11px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:5px}
.reel-card .plat{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);align-self:flex-start;padding:2px 8px;border-radius:6px}
.stage-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.stage-row:last-child{border:0}
.stage-t{width:70px;flex:none;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted)}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.metric-tile{border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.metric-tile .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.metric-tile .v{font-family:"IBM Plex Mono",monospace;font-size:15px;margin-top:2px}

.src-cat{border:1px solid var(--line);border-radius:12px;padding:15px}
.src-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.src-item{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.src-item:last-child{border:0}
.src-item a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--muted)}

.steps{counter-reset:step;display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px}
.step .b{counter-increment:step;flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.step .b::before{content:counter(step)}

.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

@media (max-width:640px){
  .bar-row{grid-template-columns:90px 1fr 44px}
  .row > *{min-width:0}
}
</style>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="tally" aria-hidden="true"></span>
      <div><h1>Маркетинг Медиа</h1><div class="sub">Сравнительный анализ конкурентов и промоплан для теле- и медиапроектов</div></div>
    </div>
    <div class="langsw" role="group" aria-label="Язык вывода">
      <button data-lang="ru">RU</button>
      <button data-lang="kk">ҚАЗ</button>
    </div>
  </div>

  <div class="nav" role="tablist">
    <button data-tab="analysis" class="on">Анализ конкурентов</button>
    <button data-tab="plan">Промоплан</button>
    <button data-tab="sources">Источники данных</button>
  </div>

  <div id="tab-analysis"></div>
  <div id="tab-plan" hidden></div>
  <div id="tab-sources" hidden></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- state ---------- */
var DEFAULT_STATE = {
  lang: "ru",
  form: { type:"", name:"", desc:"", audience:"", launch:"", platforms:[], goal:"", goalNote:"", budget:"" },
  reg: [],
  product: {},
  content: {},
  mx: { instagram:[], tiktok:[], youtube:[], telegram:[], facebook:[] },
  trends: [],
  analysisSummary: "",
  useAnalysisInPlan: false,
  planData: null
};
var LSKEY = "mmedia_v1";
var state = loadState();

function loadState(){
  try{
    var raw = localStorage.getItem(LSKEY);
    if(!raw) return seedExample(clone(DEFAULT_STATE));
    var parsed = JSON.parse(raw);
    return Object.assign(clone(DEFAULT_STATE), parsed);
  }catch(e){ return seedExample(clone(DEFAULT_STATE)); }
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
var saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(LSKEY, JSON.stringify(state)); }catch(e){}
  }, 250);
}

function seedExample(s){
  s.reg = [
    {id:"c1", name:"Медиа-конкурент А", note:"Крупный ютуб-канал документалок, ставка на драму", link:"https://example.com/a"},
    {id:"c2", name:"Телеканал Б", note:"Классическое ТВ + слабый TikTok", link:"https://example.com/b"}
  ];
  s.mx.instagram = [
    {name:"Мой проект (пример)", followers:18000, ppw:4, views:9000, likes:650, comments:40, shares:60, fmt:"Reels, карусели"},
    {name:"Конкурент А", followers:42000, ppw:3, views:15000, likes:900, comments:55, shares:70, fmt:"Reels"},
    {name:"Конкурент Б", followers:9000, ppw:2, views:2200, likes:180, comments:12, shares:8, fmt:"Фото"}
  ];
  return s;
}

/* ---------- helpers ---------- */
var uid = function(){ return "id"+Math.random().toString(36).slice(2,10); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2600);
}
function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmt1(n){ return (Math.round(n*10)/10).toString(); }

var PLATFORMS = ["instagram","tiktok","youtube","telegram","facebook"];
var PLATFORM_LABEL = {instagram:"Instagram", tiktok:"TikTok", youtube:"YouTube", telegram:"Telegram", facebook:"Facebook"};

/* ---------- file export ---------- */
// Works fully standalone (no Claude needed): tries the Claude `downloads`
// capability first (present only inside a Claude Artifact view), and falls
// back to a plain browser download otherwise — which is how every other
// page on the web saves a file, so this always works on GitHub Pages, a
// local file, or any regular host.
var downloadsFn = null;
if(typeof claude !== "undefined"){
  claude.use("downloads").then(function(fn){ downloadsFn = fn; }).catch(function(){ downloadsFn = null; });
}
async function saveFile(filename, content, mime){
  if(downloadsFn){
    try{ await downloadsFn.save({filename:filename, data:content}); toast(T("saved")); return; }catch(e){ /* fall through */ }
  }
  try{
    var blob = new Blob([content], {type:(mime||"text/plain")+";charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    toast(T("saved"));
  }catch(e){ toast(T("saveFailed")); }
}

/* ---------- bilingual output strings (RU/KK) ---------- */
// The lang switch affects only text this app generates itself (templates,
// section headers, curated trend ideas) — it never touches what the user
// typed, and never touches interface button labels (per spec).
var STRINGS = {
  ru: {
    saved: "Файл сохранён", saveFailed: "Не удалось сохранить файл",
    themes: "Темы/рубрики", tone: "Тон и формат подачи", frequency: "Паттерн частоты публикаций", whitespace: "Чего не хватает (идея для отстройки)",
    noNotes: "Сначала опишите наблюдения по этому конкуренту",
    fillManually: "заполните вручную",
    gapsFilled: "Пробелы заполнены по введённым данным",
    addCompetitorsFirst: "Сначала добавьте конкурентов",
    trendsAdded: "Добавлены идеи трендов",
    needCompetitor: "Добавьте хотя бы одного конкурента, чтобы собрать анализ"
  },
  kk: {
    saved: "Файл сақталды", saveFailed: "Файлды сақтау мүмкін болмады",
    themes: "Тақырыптар/рубрикалар", tone: "Тон және берілу форматы", frequency: "Жариялау жиілігінің үлгісі", whitespace: "Немен толықтыру керек (идея)",
    noNotes: "Алдымен осы бәсекелес туралы бақылауларыңызды жазыңыз",
    fillManually: "қолмен толтырыңыз",
    gapsFilled: "Бос жерлер енгізілген деректер бойынша толтырылды",
    addCompetitorsFirst: "Алдымен бәсекелестерді қосыңыз",
    trendsAdded: "Тренд идеялары қосылды",
    needCompetitor: "Талдау жасау үшін кемінде бір бәсекелесті қосыңыз"
  }
};
function T(key){
  var d = STRINGS[state.lang] || STRINGS.ru;
  return d[key] != null ? d[key] : (STRINGS.ru[key] || key);
}

/* ---------- render root ---------- */
var TAB = "analysis";
var SUBTAB = "content";

function bindTopNav(){
  document.querySelectorAll(".nav [data-tab]").forEach(function(b){
    b.addEventListener("click", function(){
      TAB = b.dataset.tab;
      document.querySelectorAll(".nav [data-tab]").forEach(function(x){x.classList.toggle("on", x===b);});
      document.getElementById("tab-analysis").hidden = TAB!=="analysis";
      document.getElementById("tab-plan").hidden = TAB!=="plan";
      document.getElementById("tab-sources").hidden = TAB!=="sources";
      if(TAB==="plan") renderPlan();
      if(TAB==="sources") renderSources();
    });
  });
  document.querySelectorAll(".langsw [data-lang]").forEach(function(b){
    b.addEventListener("click", function(){
      state.lang = b.dataset.lang; saveState(); syncLangButtons();
    });
  });
  syncLangButtons();
}
function syncLangButtons(){
  document.querySelectorAll(".langsw [data-lang]").forEach(function(b){
    b.classList.toggle("on", b.dataset.lang === state.lang);
  });
}

function goToTab(tab, sub){
  TAB = tab; if(sub) SUBTAB = sub;
  document.querySelectorAll(".nav [data-tab]").forEach(function(x){x.classList.toggle("on", x.dataset.tab===tab);});
  document.getElementById("tab-analysis").hidden = tab!=="analysis";
  document.getElementById("tab-plan").hidden = tab!=="plan";
  document.getElementById("tab-sources").hidden = tab!=="sources";
  if(tab==="analysis") renderAnalysis();
  if(tab==="plan") renderPlan();
  if(tab==="sources") renderSources();
}

function renderAll(){
  renderAnalysis();
  renderPlan();
  renderSources();
}

/* =========================================================
   TAB: АНАЛИЗ КОНКУРЕНТОВ
   ========================================================= */
function renderAnalysis(){
  var root = document.getElementById("tab-analysis");
  root.innerHTML =
    '<div class="card stack">' +
      '<div class="section-title"><h2>Реестр конкурентов</h2><span class="hint">' + state.reg.length + ' / 10</span></div>' +
      '<div class="twrap"><table id="regTable"><thead><tr><th>Название</th><th>Заметка / УТП</th><th>Ссылка</th><th></th></tr></thead><tbody></tbody></table></div>' +
      (state.reg.length===0 ? '<div class="empty">Пока нет конкурентов. Добавьте до 10 — они появятся во всех срезах ниже.</div>' : '') +
      '<div><button class="btn primary sm" id="addCompBtn" ' + (state.reg.length>=10?'disabled':'') + '>+ Добавить конкурента</button></div>' +
    '</div>' +
    '<div class="subnav" id="subnav"></div>' +
    '<div id="subroot"></div>';

  var subs = [
    ["content","Контент"], ["product","Продукт"], ["social","Соцсети"], ["trends","Тренды"], ["summary","Итог"]
  ];
  var sn = document.getElementById("subnav");
  subs.forEach(function(s){
    var b = document.createElement("button");
    b.textContent = s[1]; b.className = SUBTAB===s[0] ? "on":"";
    b.addEventListener("click", function(){ SUBTAB = s[0]; renderAnalysis(); });
    sn.appendChild(b);
  });

  renderRegTable();
  document.getElementById("addCompBtn").addEventListener("click", function(){
    if(state.reg.length>=10) return;
    state.reg.push({id:uid(), name:"", note:"", link:""});
    saveState(); renderAnalysis();
  });

  var sr = document.getElementById("subroot");
  if(SUBTAB==="content") sr.innerHTML = "", renderContentSub(sr);
  else if(SUBTAB==="product") sr.innerHTML = "", renderProductSub(sr);
  else if(SUBTAB==="social") sr.innerHTML = "", renderSocialSub(sr);
  else if(SUBTAB==="trends") sr.innerHTML = "", renderTrendsSub(sr);
  else renderSummarySub(sr);
}

function renderRegTable(){
  var tb = document.querySelector("#regTable tbody");
  tb.innerHTML = "";
  state.reg.forEach(function(c, i){

// Purely local structuring: no AI, no invented facts — it only ever
// reorganizes words already present in the user's own notes.
var TONE_KEYWORDS = [
  ["юмор", "юмористический"], ["смешн", "юмористический"], ["ирони", "ироничный"],
  ["серьёзн", "серьёзный"], ["серьезн", "серьёзный"], ["официальн", "официальный"],
  ["драм", "драматичный"], ["эмоц", "эмоциональный"], ["личн", "личный/исповедальный"],
  ["дружелюбн", "дружелюбный"], ["провокац", "провокационный"], ["разговорн", "разговорный"],
  ["эксперт", "экспертный"], ["развлек", "развлекательный"]
];
var FORMAT_KEYWORDS = [
  ["reels", "Reels"], ["shorts", "Shorts"], ["сторис", "сторис"], ["stories", "сторис"],
  ["карусел", "карусели"], ["лайв", "прямые эфиры"], ["стрим", "прямые эфиры"],
  ["подкаст", "подкасты"], ["интервью", "интервью"], ["разбор", "разборы/аналитика"],
  ["закулис", "бэкстейдж"], ["съём", "бэкстейдж со съёмок"], ["мем", "мемы"],
  ["опрос", "опросы"], ["коллаб", "коллаборации с блогерами"], ["фото", "фотоконтент"]
];
function findKeywords(text, dict){
  var t = text.toLowerCase();
  var found = [];
  dict.forEach(function(pair){
    if(t.indexOf(pair[0])>=0 && found.indexOf(pair[1])<0) found.push(pair[1]);
  });
  return found;
}
function structureContentLocal(notes){
  var sentences = notes.split(/(?<=[.!?;\n])\s+|\n/).map(function(s){return s.trim();}).filter(Boolean);
  if(sentences.length===0) sentences = [notes.trim()];
  var tones = findKeywords(notes, TONE_KEYWORDS);
  var formats = findKeywords(notes, FORMAT_KEYWORDS);
  var freqMatch = notes.match(/(\d+)\s*(раз|публикаци|reels|видео|пост)[^\d]{0,15}(неделю|день|месяц)/i);
  var themes = sentences.slice(0, 6);
  var missingFormats = FORMAT_KEYWORDS.map(function(p){return p[1];})
    .filter(function(f, i, arr){ return arr.indexOf(f)===i; })
    .filter(function(f){ return formats.indexOf(f)<0; })
    .slice(0, 3);
  return {
    themes: themes,
    tone: tones.length ? tones.join(", ") : "— не удалось определить по тексту, уточните формулировку",
    formats: formats.length ? formats.join(", ") : "— форматы не распознаны, перечислите их явно (Reels, сторис…)",
    frequency: freqMatch ? (freqMatch[1]+" "+freqMatch[2]+" в "+freqMatch[3]) : "— частота не указана явно в наблюдениях",
    whitespace: missingFormats.length ? ("Похоже, конкурент не использует: " + missingFormats.join(", ") + " — можно занять эту нишу.") : "Конкурент использует широкий набор форматов — ищите отличие в тоне или регулярности."
  };
}

var PRODUCT_FORMAT_HINTS = [
  ["ютуб", "YouTube-контент"], ["youtube", "YouTube-контент"], ["тв", "Телевидение"],
  ["телекана", "Телевидение"], ["сериал", "Сериал"], ["подкаст", "Подкаст"],
  ["tiktok", "TikTok"], ["инстаграм", "Instagram"], ["instagram", "Instagram"],

var PRODUCT_AUDIENCE_HINTS = [
  ["молод", "молодая аудитория"], ["семейн", "семейная аудитория"], ["взросл", "взрослая аудитория"],
  ["подростк", "подростковая аудитория"], ["детск", "детская аудитория"], ["массов", "массовая аудитория"]
];
function fillProductGapsLocal(name, note){
  var text = (name+" "+note).toLowerCase();
  function pick(hints, fallback){
    for(var i=0;i<hints.length;i++){ if(text.indexOf(hints[i][0])>=0) return hints[i][1]; }
    return fallback;
  }
  return {
    positioning: note ? ("По заметке: «"+note+"»") : ("— "+T("fillManually")),
    usp: note || ("— "+T("fillManually")),
    format: pick(PRODUCT_FORMAT_HINTS, "— не определено, "+T("fillManually")),
    audience: pick(PRODUCT_AUDIENCE_HINTS, "— не определено, "+T("fillManually")),
    weak: "Сравните с данными в срезах «Соцсети» и «Контент» ниже, чтобы найти слабое место."
  };
}

var SOCIAL_COLS = [
  ["name","Аккаунт"],["followers","Подписчики"],["ppw","Постов/нед"],["views","Ср. просмотры"],
  ["likes","Ср. лайки"],["comments","Ср. комментарии"],["shares","Ср. репост+сохр"],["fmt","Форматы"]
];
function computeER(row){
  var f = num(row.followers); if(f<=0) return 0;
  return (num(row.likes)+num(row.comments)+num(row.shares)) / f * 100;
}
function computeReach(row){
  var f = num(row.followers); if(f<=0) return 0;
  return num(row.views) / f;
}
function median(arr){
  if(!arr.length) return 0;
  var s = arr.slice().sort(function(a,b){return a-b;});
  var m = Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}

  /* comparison charts */
  if(rows.length>=2){
    var cmp = document.createElement("div"); cmp.className="card stack";
    cmp.innerHTML = '<h3>Сравнение по метрикам</h3>';

      ["ER, %", function(r){return computeER(r);}],

    ];
    var me = rows[0];
    var competitors = rows.slice(1);
    metrics.forEach(function(m){
      var label = m[0], fn = m[1];
      var vals = rows.map(fn);
      var max = Math.max.apply(null, vals.concat([0.001]));
      var compVals = competitors.map(fn);
      var med = median(compVals);
      var block = document.createElement("div");
      block.innerHTML = '<div style="font-weight:600;font-size:13px;margin-bottom:8px">'+label+'</div>';
      rows.forEach(function(r,i){
        var v = vals[i];
        var pct = Math.min(100, (v/max)*100);
        var medPct = Math.min(100, (med/max)*100);
        var br = document.createElement("div"); br.className="bar-row";
        br.innerHTML = '<div class="mono" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.name||(i===0?"Мой проект":"—"))+'</div>' +

          (i>0 ? '<div class="bar-median" style="left:'+medPct+'%"></div>' : '') +
          '</div><div class="num" style="font-size:12px;text-align:right">'+fmt1(v)+'</div>';
        block.appendChild(br);
      });
      if(me && competitors.length){
        var myVal = fn(me);
        var diff = med>0 ? ((myVal-med)/med*100) : (myVal>0?100:0);
        var v = document.createElement("div");
        v.className = "verdict " + (diff>=0?"up":"down");
        v.textContent = "Мой проект " + (diff>=0?"выше":"ниже") + " медианы конкурентов на " + fmt1(Math.abs(diff)) + "%";
        block.appendChild(v);
      }
      cmp.appendChild(block);
    });
    wrap.appendChild(cmp);
  }

  root.appendChild(wrap);

  /* bindings */
  tw.querySelectorAll("input").forEach(function(inp){
    inp.addEventListener("input", function(){
      var tr = inp.closest("tr"); var i = +tr.dataset.i;
      var col = inp.dataset.col;
      rows[i][col] = inp.type==="number" ? num(inp.value) : inp.value;
      saveState();
      // live-update only the ER/reach cells + charts without full re-render jank on every keystroke of same row is fine to re-render whole subtab, but that's expensive per keypress -> update just this row's computed cells
      var er = computeER(rows[i]), reach = computeReach(rows[i]);
      tr.children[tr.children.length-3].textContent = fmt1(er);
      tr.children[tr.children.length-2].textContent = fmt1(reach);
    });
    inp.addEventListener("change", function(){ renderAnalysis(); });
  });
  tw.querySelectorAll("[data-del]").forEach(function(b){
    b.addEventListener("click", function(){
      var i = +b.closest("tr").dataset.i;
      rows.splice(i,1); saveState(); renderAnalysis();
    });
  });
  document.getElementById("addRow").addEventListener("click", function(){

    saveState(); renderAnalysis();
  });
  document.getElementById("clearPlat").addEventListener("click", function(){
    state.mx[plat] = []; saveState(); renderAnalysis();
  });
  document.getElementById("expCsv").addEventListener("click", async function(){
    if(!rows.length){ toast("Нет данных для экспорта"); return; }
    var header = SOCIAL_COLS.map(function(c){return c[1];}).concat(["ER %","Охват/подписчики"]).join(";");
    var lines = rows.map(function(r){
      return SOCIAL_COLS.map(function(c){ return '"'+String(r[c[0]]!=null?r[c[0]]:"").replace(/"/g,'""')+'"'; })
        .concat([fmt1(computeER(r)), fmt1(computeReach(r))]).join(";");
    });
    var csv = "﻿" + header + "\n" + lines.join("\n");
    saveFile(plat+"_sravnenie.csv", csv, "text/csv");
  });
}

// A rules-based aggregate report: every line is computed straight from data
// already entered elsewhere in the app (competitor notes, product table,
// social matrix ER/reach, trends) — no invented facts, no external calls.
function buildSummaryLocal(){
  var lines = [];
  var name = state.form.name || "наш проект";
  lines.push("ОБЩИЙ ВЫВОД");
  lines.push("Проект «"+name+"» сравнивается с "+state.reg.length+" "+(state.reg.length===1?"конкурентом":"конкурентами")+": "+
    state.reg.map(function(r){return r.name||"(без названия)";}).join(", ")+".");
  lines.push("");

  lines.push("ПРОДУКТ");
  var prodMe = state.product["__me"] || {};
  var filledMe = ["positioning","usp","format","audience","weak"].filter(function(k){return prodMe[k];}).length;
  lines.push("Заполнено полей по своему проекту: "+filledMe+"/5.");
  state.reg.forEach(function(r){
    var p = state.product[r.id] || {};
    var filled = ["positioning","usp","format","audience","weak"].filter(function(k){return p[k];}).length;
    lines.push("— "+(r.name||"(без названия)")+": заполнено "+filled+"/5"+(p.weak?"; слабое место: "+p.weak:"")+".");
  });
  lines.push("");

  lines.push("КОНТЕНТ");
  var anyContent = false;
  state.reg.forEach(function(r){
    var c = state.content[r.id];
    if(c && c.ai){
      anyContent = true;
      lines.push("— "+(r.name||"(без названия)")+": тон — "+c.ai.tone+"; форматы — "+c.ai.formats+".");
    } else if(c && c.notes){
      anyContent = true;
      lines.push("— "+(r.name||"(без названия)")+": наблюдения внесены, но не структурированы (нажмите «Структурировать» во вкладке «Контент»).");
    }
  });
  if(!anyContent) lines.push("Наблюдения по контенту конкурентов пока не внесены.");
  lines.push("");

  lines.push("СОЦСЕТИ");
  var anySocial = false;
  var bestPlatform = null, bestDiff = -Infinity;
  PLATFORMS.forEach(function(plat){
    var rows = state.mx[plat];
    if(!rows || rows.length<2) return;
    anySocial = true;
    var me = rows[0], competitors = rows.slice(1);
    var myER = computeER(me);
    var compER = competitors.map(computeER);
    var med = median(compER);
    var diff = med>0 ? ((myER-med)/med*100) : (myER>0?100:0);
    lines.push("— "+PLATFORM_LABEL[plat]+": ER моего проекта "+fmt1(myER)+"%, медиана конкурентов "+fmt1(med)+"% ("+(diff>=0?"выше":"ниже")+" на "+fmt1(Math.abs(diff))+"%).");
    if(diff>bestDiff){ bestDiff=diff; bestPlatform=plat; }
  });
  if(!anySocial) lines.push("Недостаточно данных — заполните минимум 2 строки (свой проект + конкурент) хотя бы на одной площадке во вкладке «Соцсети».");
  lines.push("");

  lines.push("ТРЕНДЫ К ИСПОЛЬЗОВАНИЮ");
  if(state.trends.length){
    state.trends.slice(0,5).forEach(function(t){ lines.push("— "+(t.title||"без названия")+(t.desc?": "+t.desc:"")); });
  } else {
    lines.push("Тренды пока не добавлены — откройте вкладку «Тренды».");
  }
  lines.push("");

  lines.push("РЕКОМЕНДАЦИИ ДЛЯ ПРОМОПЛАНА");
  var recs = [];
  if(bestPlatform) recs.push("Сделайте ставку на "+PLATFORM_LABEL[bestPlatform]+" — там ваш отрыв от конкурентов больше всего ("+fmt1(bestDiff)+"%).");
  var noProductGaps = state.reg.filter(function(r){ var p=state.product[r.id]||{}; return !p.weak; });
  if(noProductGaps.length) recs.push("Заполните «Слабое место» для: "+noProductGaps.map(function(r){return r.name||"конкурент";}).join(", ")+" — это подскажет вашу отстройку.");
  if(!anyContent) recs.push("Опишите наблюдения по контенту конкурентов — без этого сравнение неполное.");
  if(state.trends.length===0) recs.push("Добавьте хотя бы 2-3 тренда/формата — они станут основой идей для Reels/Shorts.");
  if(!anySocial) recs.push("Внесите цифры хотя бы по одной социальной площадке для количественного сравнения.");
  recs.push("Используйте кнопку «Использовать в промоплане» ниже, чтобы учесть этот отчёт при сборке плана.");
  recs.forEach(function(r, i){ lines.push((i+1)+". "+r); });

  return lines.join("\n");
}

function refreshCountdownOnly(){
  var el = document.getElementById("countdownVal");
  if(!el) return;

function countdownText(){
  if(!state.form.launch) return "дата не указана";
  var launch = new Date(state.form.launch+"T00:00:00");
  var now = new Date(); now.setHours(0,0,0,0);
  var days = Math.round((launch-now)/86400000);
  if(days>0) return "T-"+days+" (до запуска "+days+" дн.)";
  if(days<0) return "T+"+Math.abs(days)+" ("+Math.abs(days)+" дн. с запуска)";
  return "T-0 — день запуска";
}

function buildQuickTemplate(){
  var f = state.form;
  var bank = PLAN_BANK[state.lang] || PLAN_BANK.ru;
  var type = f.type || bank.defaultType;
  var name = f.name || (state.lang==="kk" ? "жоба" : "проект");
  var goal = f.goal || bank.defaultGoal;
  var plats = f.platforms.length ? f.platforms : ["Instagram","YouTube"];
  var risks = bank.risks.slice();
  if(state.useAnalysisInPlan && state.analysisSummary) risks.push(bank.fromAnalysisRisk);
  return {
    message: bank.messageTpl(name),
    slogan: bank.sloganBase,
    positioning: bank.positioningTpl(type, f.audience||bank.widerAudience, goal),
    rubrics: bank.rubrics,
    reels: bank.hooks.map(function(h, i){
      var t = i<2 ? "T-14" : i<4 ? "T-3" : "T+"+(i-3);
      return {hook: bank.hookLabel+": "+h, platform: plats[i%plats.length], timing: t, desc:""};
    }),
    stages: bank.stages.map(function(s){ return {t:s[0], action:s[1]}; }),
    metrics: bank.metrics.map(function(m){ return {name:m[0], target:m[1]}; }),
    risks: risks,
    checklist: bank.checklist
  };
}

function renderPlanOutput(){
  var root = document.getElementById("tab-plan");
  var old = document.getElementById("planOutputWrap");
  if(old) old.remove();
  var wrap = document.createElement("div"); wrap.id = "planOutputWrap"; wrap.className = "stack";

  if(state.planData){
    wrap.appendChild(renderStructuredPlan(state.planData));
  } else {
    wrap.appendChild(Object.assign(document.createElement("div"), {className:"empty", textContent:"Заполните карточку проекта и нажмите «Собрать промоплан»."}));
  }
  root.appendChild(wrap);
}

function planActions(){
  return '<div class="row" style="margin-top:12px;flex:none"><button class="btn sm" id="copyPlan">Копировать текст</button><button class="btn sm" id="dlPlan">Скачать .md</button></div>';
}
function bindPlanActions(text){
  var c = document.getElementById("copyPlan");
  if(c) c.addEventListener("click", async function(){
    try{ await navigator.clipboard.writeText(text); toast("Скопировано"); }
    catch(e){ toast("Не удалось скопировать — выделите текст вручную"); }
  });
  var d = document.getElementById("dlPlan");
  if(d) d.addEventListener("click", function(){
    saveFile((state.form.name||"promoplan")+".md", text, "text/markdown");
  });
}

function renderStructuredPlan(p){
  var card = document.createElement("div"); card.className = "plan-doc stack";
  var launch = state.form.launch;
  var L = PLAN_LABELS[state.lang] || PLAN_LABELS.ru;
  var md = [];
  md.push("# Промоплан: "+(state.form.name||"проект"));
  md.push("");
  md.push("**"+L.message+":** "+ (p.message||"—"));
  md.push("**"+L.slogan+":** "+ (p.slogan||"—"));
  md.push("**"+L.positioning+":** "+ (p.positioning||"—"));
  md.push("");
  md.push("## "+L.rubrics);
  (p.rubrics||[]).forEach(function(r){ md.push("- "+r); });
  md.push("");
  md.push("## "+L.reels);
  (p.reels||[]).forEach(function(r,i){ md.push((i+1)+". ["+(r.platform||"")+", "+(r.timing||"")+"] "+(r.hook||"")+(r.desc?" — "+r.desc:"")); });
  md.push("");
  md.push("## "+L.schedule);
  (p.stages||[]).forEach(function(s){ md.push("- **"+(s.t||"")+"**: "+(s.action||"")); });
  md.push("");
  md.push("## "+L.metrics);
  (p.metrics||[]).forEach(function(m){ md.push("- "+(m.name||"")+": "+(m.target||"")); });
  md.push("");
  md.push("## "+L.risks);
  (p.risks||[]).forEach(function(r){ md.push("- "+r); });
  md.push("");
  md.push("## "+L.checklist);
  (p.checklist||[]).forEach(function(c){ md.push("- [ ] "+c); });
  var mdText = md.join("\n");

  card.innerHTML =
    '<div class="section-title">' +
      '<h3>'+esc(state.form.name||"Промоплан")+'</h3>' +
      '<span class="badge example">'+L.badge+'</span>' +
      '<span class="countdown">'+ (launch ? '📅 <span class="num" id="countdownVal">'+countdownText()+'</span>' : L.launchUnset) +'</span>' +
    '</div>' +
    '<h4>'+L.message+'</h4>' +
    '<div><strong>'+esc(p.message||"")+'</strong></div>' +
    '<div class="hint">'+L.slogan+': «'+esc(p.slogan||"")+'»</div>' +
    '<div>'+esc(p.positioning||"")+'</div>' +
    '<h4>'+L.rubrics+'</h4>' +
    '<ul style="margin:0;padding-left:20px">'+(p.rubrics||[]).map(function(r){return '<li>'+esc(r)+'</li>';}).join("")+'</ul>' +
    '<h4>'+L.reels+'</h4>' +
    '<div class="reel-grid">'+(p.reels||[]).map(function(r){
      return '<div class="reel-card"><span class="plat">'+esc(r.platform||"")+' · '+esc(r.timing||"")+'</span><strong>'+esc(r.hook||"")+'</strong>'+(r.desc?'<div style="color:var(--muted)">'+esc(r.desc)+'</div>':'')+'</div>';
    }).join("")+'</div>' +
    '<h4>'+L.schedule+'</h4>' +
    '<div>'+(p.stages||[]).map(function(s){return '<div class="stage-row"><div class="stage-t mono">'+esc(s.t||"")+'</div><div>'+esc(s.action||"")+'</div></div>';}).join("")+'</div>' +
    '<h4>'+L.metrics+'</h4>' +
    '<div class="metric-grid">'+(p.metrics||[]).map(function(m){return '<div class="metric-tile"><div class="l">'+esc(m.name||"")+'</div><div class="v">'+esc(m.target||"")+'</div></div>';}).join("")+'</div>' +
    '<h4>'+L.risks+'</h4>' +
    '<ul style="margin:0;padding-left:20px">'+(p.risks||[]).map(function(r){return '<li>'+esc(r)+'</li>';}).join("")+'</ul>' +
    '<h4>'+L.checklist+'</h4>' +
    '<ul style="margin:0;padding-left:20px">'+(p.checklist||[]).map(function(c){return '<li>'+esc(c)+'</li>';}).join("")+'</ul>' +
    planActions();
  setTimeout(function(){ bindPlanActions(mdText); }, 0);
  return card;
}

function step(title, desc){
  return '<div class="step"><div class="b"></div><div><strong>'+title+'</strong><div class="hint">'+desc+'</div></div></div>';
}
function srcCat(title, items){
  return '<div class="src-cat" style="flex:1;min-width:260px"><h3 style="font-size:15px">'+title+'</h3><div class="src-list">' +
    items.map(function(it){ return '<div class="src-item"><span>'+it[0]+'</span><a href="'+it[1]+'" target="_blank" rel="noopener">Открыть ↗</a></div>'; }).join("") +
    '</div></div>';
}
